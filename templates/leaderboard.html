{% extends "base.html" %}

{% block title %}Рейтинг{% endblock %}

{% block content %}
<h2>Загальний рейтинг</h2>

<div style="margin-bottom: 20px;">
    <form method="GET" action="{{ url_for('show_leaderboard') }}">
        <select name="position_filter">
            <option value="">-- Всі посади --</option>
            {% for pos in available_positions %}
                <option value="{{ pos }}" {% if pos == current_filter %}selected{% endif %}>{{ pos }}</option>
            {% endfor %}
        </select>
        <button type="submit">Фільтр</button>
    </form>
    
    <div style="margin-top: 10px;">
        <a href="{{ url_for('export_leaderboard_csv') }}" title="Завантажити весь рейтинг">
            <button style="background-color: #17a2b8; color: white;">Завантажити CSV</button>
        </a>
    </div>
</div>

<table>
    <thead>
        <tr>
            <th>№</th><th>ПІБ</th><th>Посада</th><th style="text-align: right;">Бал</th><th style="text-align: center;">Дії</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in leaderboard %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>
                <span id="name-text-{{ loop.index }}">{{ entry.name }}</span>
                <input type="text" id="name-input-{{ loop.index }}" form="edit-form-{{ loop.index }}" name="new_name" value="{{ entry.name }}" style="display:none; padding: 2px; font-size: 14px; width: 100%;">
            </td>
            <td>
                <span id="pos-text-{{ loop.index }}">{{ entry.position }}</span>
                <input type="text" id="pos-input-{{ loop.index }}" form="edit-form-{{ loop.index }}" name="new_position" value="{{ entry.position }}" style="display:none; padding: 2px; font-size: 14px; width: 100%;">
            </td>
            <td style="text-align: right;">
                <span id="score-text-{{ loop.index }}">{{ "%.2f"|format(entry.score) }}</span>
                <input type="number" step="any" id="score-input-{{ loop.index }}" form="edit-form-{{ loop.index }}" name="new_score" value="{{ entry.score }}" style="display:none; padding: 2px; font-size: 14px; width: 80px; text-align: right;">
            </td>
            <td style="text-align: center;">
                <div id="actions-display-{{ loop.index }}">
                    <a href="{{ url_for('download_report_docx', name=entry.name) }}" title="Завантажити звіт">
                        <button style="background-color: green; color: white; border: none; padding: 4px 8px; border-radius: 4px;">Word</button>
                    </a>
                    
                    <button type="button" onclick="toggleEdit({{ loop.index }})" style="background-color: #ffc107; color: black; border: none; padding: 4px 8px; border-radius: 4px; margin-left: 5px;">Редагувати</button>

                    <form method="POST" action="{{ url_for('delete_leaderboard_entry') }}" style="display: inline-block; margin-left: 5px;">
                        <input type="hidden" name="name" value="{{ entry.name }}">
                        <input type="password" name="admin_password" placeholder="Pass" required style="width: 50px; font-size: 10px; padding: 2px;">
                        <button type="submit" onclick="return confirm('Видалити?');" style="background-color: red; color: white; border: none; padding: 4px 8px; border-radius: 4px;">X</button>
                    </form>
                </div>
                
                <div id="actions-edit-{{ loop.index }}" style="display: none;">
                    <form id="edit-form-{{ loop.index }}" method="POST" action="{{ url_for('edit_leaderboard_entry') }}" style="display: inline-block;">
                        <input type="hidden" name="original_name" value="{{ entry.name }}">
                        <input type="password" name="admin_password" placeholder="Pass" required style="width: 50px; font-size: 10px; padding: 2px;">
                        <button type="submit" style="background-color: #28a745; color: white; border: none; padding: 4px 8px; border-radius: 4px;">Зберегти</button>
                        <button type="button" onclick="cancelEdit({{ loop.index }})" style="background-color: #6c757d; color: white; border: none; padding: 4px 8px; border-radius: 4px; margin-left: 5px;">Скасувати</button>
                    </form>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div style="margin-top: 20px;">
    <a href="{{ url_for('index') }}"><button>На головну</button></a>
</div>

<script>
    function toggleEdit(index) {
        document.getElementById('name-text-' + index).style.display = 'none';
        document.getElementById('pos-text-' + index).style.display = 'none';
        document.getElementById('score-text-' + index).style.display = 'none';
        document.getElementById('actions-display-' + index).style.display = 'none';
        
        document.getElementById('name-input-' + index).style.display = 'inline-block';
        document.getElementById('pos-input-' + index).style.display = 'inline-block';
        document.getElementById('score-input-' + index).style.display = 'inline-block';
        document.getElementById('actions-edit-' + index).style.display = 'block';
    }

    function cancelEdit(index) {
        document.getElementById('name-text-' + index).style.display = 'inline';
        document.getElementById('pos-text-' + index).style.display = 'inline';
        document.getElementById('score-text-' + index).style.display = 'inline';
        document.getElementById('actions-display-' + index).style.display = 'block';
        
        document.getElementById('name-input-' + index).style.display = 'none';
        document.getElementById('pos-input-' + index).style.display = 'none';
        document.getElementById('score-input-' + index).style.display = 'none';
        document.getElementById('actions-edit-' + index).style.display = 'none';
    }
</script>
{% endblock %}
